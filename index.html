<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="QUIZVERSE — Challenge Your Mind. Beat Your Best. A modern quiz gaming platform." />
  <meta name="theme-color" content="#0F172A" />
  <title>QUIZVERSE — Challenge Your Mind. Beat Your Best.</title>

  <!-- PWA / installable app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="application-name" content="QUIZVERSE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QUIZVERSE" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Social / share preview -->
  <meta property="og:title" content="QUIZVERSE — Challenge Your Mind. Beat Your Best." />
  <meta property="og:description" content="A modern quiz gaming platform. 6 categories, 3 difficulty levels, streaks, XP and leaderboards." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/icon-512.png" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Ambient background layers -->
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- ===== Navbar (persistent) ===== -->
  <header class="navbar" id="navbar"></header>

  <!-- ===== Mobile nav drawer ===== -->
  <div class="nav-scrim" id="navScrim" hidden></div>

  <!-- ===== Main app viewport ===== -->
  <main id="app" class="app-view" role="main" aria-live="polite"></main>

  <!-- ===== Toast / achievement layer ===== -->
  <div class="toast-layer" id="toastLayer" aria-live="assertive"></div>

  <!-- ===== Footer ===== -->
  <footer class="footer" id="footer"></footer>

  <!-- Scripts (ordered, classic scripts sharing the QV namespace) -->
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/audio.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/state/store.js"></script>
  <script src="js/components/components.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/categories.js"></script>
  <script src="js/screens/difficulty.js"></script>
  <script src="js/screens/quiz.js"></script>
  <script src="js/screens/result.js"></script>
  <script src="js/screens/leaderboard.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/about.js"></script>
  <script src="js/app.js"></script>

  <!-- Register service worker for offline / installable PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
