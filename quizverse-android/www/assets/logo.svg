<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QUIZVERSE logo">
  <defs>
    <linearGradient id="qvGrad" x1="72" y1="72" x2="440" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="qvGlass" x1="128" y1="110" x2="384" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="qvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="56" y="56" width="400" height="400" rx="104" fill="url(#qvGrad)" filter="url(#qvShadow)"/>
  <!-- Glass sheen -->
  <rect x="56" y="56" width="400" height="400" rx="104" fill="url(#qvGlass)"/>

  <!-- Orbit ring (quiz "verse" motif) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10"/>
  <circle cx="256" cy="106" r="14" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Big Q mark -->
  <g fill="#ffffff">
    <circle cx="256" cy="252" r="96" fill="none" stroke="#ffffff" stroke-width="34"/>
    <!-- Q tail -->
    <rect x="300" y="300" width="70" height="34" rx="17" transform="rotate(45 300 300)" fill="#ffffff"/>
  </g>

  <!-- Spark / cyan dot -->
  <circle cx="330" cy="176" r="16" fill="#67e8f9"/>
</svg>
